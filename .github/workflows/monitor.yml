name: Ticket Monitor

# Triggered exclusively by an external scheduler (cron-job.org) posting to the
# workflow_dispatch REST endpoint. GitHub's own `schedule` trigger is deliberately
# absent for two reasons:
#   1. It delivered ~2 of every 71 requested runs (observed gaps of 128/113/115
#      minutes against a "*/5" cron), which is useless for catching cancellations.
#   2. Any workflow carrying a `schedule` trigger is auto-disabled after 60 days
#      without repository activity -- and that disables *every* trigger on the
#      workflow, with no automatic re-enable. A monitor watching a sold-out month
#      writes no state, so it makes no commits, so it would silently die on day 60.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --no-dev

      - name: Check ticket availability
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: uv run main.py

      - name: Commit state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit."
          else
            git commit -m "Update ticket availability state"
            git pull --rebase --autostash
            git push
          fi
